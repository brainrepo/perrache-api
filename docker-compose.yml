version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: perrache-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: perrache
      POSTGRES_PASSWORD: perrache_dev_password
      POSTGRES_DB: perrache
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U perrache']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
